stages:
  - test

variables:
  PYTHON_VERSION: "3.13"

test:
  stage: test
  image: python:${PYTHON_VERSION}
  before_script:
    - python -m pip install --upgrade pip
    - pip install pytest pytest-allure-adaptor requests
  script:
    - pytest test_simple.py test_login.py -v
    - pytest test_simple.py test_login.py --alluredir=allure-results
  artifacts:
    when: always
    paths:
      - allure-results/
    expire_in: 7 days
  only:
    - main
    - master
    - merge_requests